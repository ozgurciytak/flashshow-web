<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Show Prototip</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        #app-container { width: 375px; height: 667px; background-color: #1a1a1a; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
        .active { display: flex; }
        h2 { text-align: center; color: #ffcc00; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background-color: #333; color: white; border: 1px solid #555; }
        button { background-color: #ffcc00; color: black; font-weight: bold; cursor: pointer; }
        .team-btn { background-color: #444; color: white; margin-bottom: 10px; font-size: 16px; border: 2px solid transparent; }
        .team-btn:hover { border-color: #ffcc00; }
        .ad-banner { background-color: #444; height: 80px; display: flex; justify-content: center; align-items: center; border-radius: 10px; margin-bottom: 20px; font-size: 12px; color: #aaa; text-align: center;}
        #show-btn { height: 150px; width: 150px; border-radius: 50%; margin: auto; font-size: 20px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
        #show-screen { padding: 0; justify-content: center; align-items: center; text-align: center; font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer; }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
        <h1 style="text-align: center; color: yellow;">⚡<br>Flash Show</h1>
        <p style="text-align: center; color: #aaa;">Taraftar Uygulaması</p>
        <div style="margin-top: auto; margin-bottom: auto;">
            <input type="email" placeholder="E-posta" value="taraftar@gmail.com">
            <input type="password" placeholder="Şifre" value="123456">
            <button onclick="nav('screen-teams')">Giriş Yap</button>
        </div>
    </div>

    <!-- TEAM SELECTION SCREEN -->
    <div id="screen-teams" class="screen">
        <h2>Takımını Seç</h2>
        <p style="text-align: center; color: #ccc;">Lütfen desteklediğiniz takımı seçin</p>
        <div style="margin-top: 20px;">
            <button class="team-btn" onclick="selectTeam('Sarı-Lacivert', '#000080', '#FFFF00')">💛💙 Sarı - Lacivert</button>
            <button class="team-btn" onclick="selectTeam('Sarı-Kırmızı', '#A32638', '#FDB912')">❤️💛 Sarı - Kırmızı</button>
            <button class="team-btn" onclick="selectTeam('Siyah-Beyaz', '#000000', '#FFFFFF')">🖤🤍 Siyah - Beyaz</button>
            <button class="team-btn" onclick="selectTeam('Bordo-Mavi', '#800000', '#0000FF')">❤️💙 Bordo - Mavi</button>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin:0;">Ana Ekran</h3>
            <span style="color:red; font-size: 12px; cursor: pointer;" onclick="nav('screen-login')">Çıkış</span>
        </div>
        <div class="ad-banner">
            [Admin Reklam Alanı]<br>Örn: Sponsor Yeni Forma Satış Linki
        </div>
        <h2 id="team-name-display" style="margin-bottom: 30px;">Takım</h2>
        <button id="show-btn" onclick="startShow()">ŞOVU<br>BAŞLAT!</button>
    </div>

    <!-- SHOW SCREEN -->
    <div id="screen-show" class="screen" onclick="stopShow()">
        <div style="margin: auto;">
            Şovu Bitirmek İçin<br>Ekrana Dokun
            <p style="font-size: 14px; font-weight: normal; margin-top:20px;">(Gerçek uygulamada cihazın arka flaşı da bu renklerle senkronize yanıp sönecektir)</p>
        </div>
    </div>

</div>

<script>
    let primaryColor = '#000';
    let secondaryColor = '#fff';
    let showInterval = null;
    let isPrimary = true;

    function nav(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function selectTeam(name, c1, c2) {
        primaryColor = c1;
        secondaryColor = c2;
        document.getElementById('team-name-display').innerText = name + ' Taraftarı';
        document.getElementById('show-btn').style.backgroundColor = primaryColor;
        document.getElementById('show-btn').style.color = secondaryColor;
        document.getElementById('show-btn').style.border = '5px solid ' + secondaryColor;
        nav('screen-home');
    }

    function startShow() {
        nav('screen-show');
        const showScreen = document.getElementById('screen-show');
        
        showInterval = setInterval(() => {
            if(isPrimary) {
                showScreen.style.backgroundColor = primaryColor;
                showScreen.style.color = secondaryColor;
            } else {
                showScreen.style.backgroundColor = secondaryColor;
                showScreen.style.color = primaryColor;
            }
            isPrimary = !isPrimary;
        }, 500); // 500ms (Yarım saniyede bir renk/flaş değişimi)
    }

    function stopShow() {
        clearInterval(showInterval);
        document.getElementById('screen-show').style.backgroundColor = '#1a1a1a';
        document.getElementById('screen-show').style.color = 'white';
        nav('screen-home');
    }
</script>

</body>
</html>
