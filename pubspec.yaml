name: flashshow
description: Taraftar Flash Show Uygulaması
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Hardware & UI
  torch_light: ^1.1.0
  cupertino_icons: ^1.0.2
  
  # Localization
  easy_localization: ^3.0.3

  # Local Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/langs/
