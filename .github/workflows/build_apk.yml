name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Creating android platform project..."
            flutter create . --platforms=android --org=com.flashshow.app
          fi

      - name: Configure Gradle for SDK 36 and Firebase
        run: |
          # Set local.properties values
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          # Replace in Kotlin DSL build.gradle.kts if exists
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          fi

          # Replace in Groovy build.gradle if exists
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          set -e
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt

      - name: Print Build Log on Failure
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -n 150 build_log.txt

      - name: Locate Built Files
        if: always()
        run: |
          echo "=== SEARCHING FOR APK FILES ==="
          find build -name "*.apk" -type f || echo "No apk found"

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlashShow-Release-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
