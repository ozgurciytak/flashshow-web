name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Creating android platform project..."
            flutter create . --platforms=android --org=com.flashshow.app
          fi

      - name: Configure Android Gradle for Firebase
        run: |
          # Set minSdkVersion to 21 for Firebase
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          # Enable multiDex
          find android/app -name "build.gradle" -exec sed -i '/defaultConfig {/a \        multiDexEnabled true' {} +

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlashShow-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
